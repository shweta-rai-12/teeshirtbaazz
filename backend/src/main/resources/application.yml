spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/teeshirtbazz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:example}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:SuperSecretJwtKeyForTeeShirtBazz}
  expiration-ms: 86400000
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
